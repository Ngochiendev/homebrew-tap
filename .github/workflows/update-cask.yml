name: Update SenseBar from appcast

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sensebar-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify appcast release and update cask
        id: appcast
        run: python3 scripts/update_from_appcast.py

      - name: Validate updated cask
        if: steps.appcast.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew tap Ngochiendev/tap
          TAP_PATH="$(brew --repository Ngochiendev/tap)"
          cp Casks/sensebar.rb "$TAP_PATH/Casks/sensebar.rb"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/homebrew-check-config"
          if brew help trust >/dev/null 2>&1; then
            brew trust --cask Ngochiendev/tap/sensebar
          fi
          brew style --cask Ngochiendev/tap/sensebar
          brew audit --cask --strict --online Ngochiendev/tap/sensebar
          git diff --check

      - name: Commit verified cask update
        if: steps.appcast.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.appcast.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sensebar.rb
          git commit -m "chore(cask): update SenseBar to ${RELEASE_VERSION}"
          git push origin HEAD:main
